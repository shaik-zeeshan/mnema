[package]
name = "mnema-gpui"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Parity JSON -> shell models, plus app-core's fixture seed. Tests turn it on
# through the self dev-dependency below; the shipped binary leaves it off.
fixtures = ["app-core/fixtures"]
# Per-frame work + dropped frames (from GPUI's frame profiler), keystroke->paint,
# summon latency and startup milestones on the Debug target `mnema_gpui::feel`
# (scripts/gpui-feel-report.sh reads them).
feel-metrics = ["gpui-kit/profiler"]

[dependencies]
anyhow = "1"
app-core = { path = "../../crates/app-core", default-features = false }
app-infra = { path = "../../crates/app-infra" }
async-channel = "2"
block2 = "0.6"
capture-microphone = { path = "../../crates/capture-microphone" }
capture-screen = { path = "../../crates/capture-screen" }
capture-types = { path = "../../crates/capture-types" }
global-hotkey = "=0.9.0"
gpui-kit = "=0.9.0"
gpui-pre-util = "=0.3.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAccessibility", "NSAlert", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString", "NSTimeZone", "NSURL", "block2"] }
raw-window-handle = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tray-icon = { version = "=0.26.1", default-features = false }
url = "2"
uuid = { version = "1", features = ["v4"] }

[[example]]
name = "scrub-bench"
path = "examples/scrub_bench.rs"
required-features = ["fixtures", "feel-metrics"]

[[test]]
name = "visual"
harness = false

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
image = "0.25"
mnema-gpui = { path = ".", features = ["fixtures"] }
tempfile = "3"
