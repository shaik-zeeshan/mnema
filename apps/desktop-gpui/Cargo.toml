[package]
name = "mnema-gpui"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Parity JSON -> shell models, plus app-core's fixture seed. Tests turn it on
# through the self dev-dependency below; the shipped binary leaves it off.
fixtures = ["app-core/fixtures"]
# Frame time, keystroke->paint, summon latency and startup milestones on the
# Debug target `mnema_gpui::feel` (scripts/gpui-feel-report.sh reads them).
feel-metrics = []

[dependencies]
anyhow = "1"
app-core = { path = "../../crates/app-core", default-features = false }
app-infra = { path = "../../crates/app-infra" }
async-channel = "2"
block2 = "0.6"
capture-microphone = { path = "../../crates/capture-microphone" }
capture-screen = { path = "../../crates/capture-screen" }
capture-types = { path = "../../crates/capture-types" }
gpui-kit = "=0.9.0"
gpui-pre-util = "=0.3.11"
log = "0.4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAccessibility", "NSResponder", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString", "block2"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "scrub-bench"
path = "src/bin/scrub_bench.rs"
required-features = ["fixtures", "feel-metrics"]

[[test]]
name = "visual"
harness = false

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
image = "0.25"
mnema-gpui = { path = ".", features = ["fixtures"] }
tempfile = "3"
