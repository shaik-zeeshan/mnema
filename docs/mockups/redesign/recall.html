<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mnema — Quick Recall</title>
  <link rel="stylesheet" href="kit.css" />
  <script src="kit.js"></script>
  <style>
    /* =====================================================================
       Quick Recall — the floating ⌥⌘Space launcher. Prefix rc-.
       Answer-first bar; the window IS the bar (frameless, transparent, ~800 wide)
       and is resized to this panel's measured height, top edge fixed:
         slim bar (60px) → ↓ recents (⌫ removes the selected Recent) → best moment + ranked moments (≤420px)
         → question detected / Tab → answer + cited evidence
         → Quick Look (~590px): the bar stays on top, the preview opens below.
       Natural language becomes inline pills (real operators shown in the
       footer). → at the end of the text accepts the dimmed inline completion
       (as search-keys.ts does today). ↓ moves from the field into the list;
       there Space opens Quick Look (in the field Space is just a space), as do
       the Quick Look button and a row's eye button. In Quick Look ←/→ scrub
       ±15 s, ↑/↓ other results, ↵ opens THAT frame in Timeline, Esc/Space back
       to the list with the same selection.
       Auto-answer (Settings → Ask AI → "Answer questions automatically"):
       always | local (default: only when the model runs on this Mac) | never.
       When it's off for the current model, a detected question shows a quiet
       "Press ⇥ to ask <model>" row instead of streaming.
       On-frame outlines: solid = keyword, dashed = meaning.
       Growth animates clip-path + transforms only (no layout animation):
       the panel is --max tall, clipped to the measured --h; --cap is how tall
       this state may get (420 list, 640 Quick Look).
       Hooks: ?q=  ?state=<name> (see RC_STATES + the "Mockup state" picker bottom-left; each state
              carries its own default ?q/?look/?tab)  ?sel=N  ?look=1  ?cite=N  ?tab=1  ?pill=app|date|src
              ?auto=always|local|never (default local)  ?local=1 (local model)  ?keys=down,space  ?theme=light
       ===================================================================== */
    body { overflow: hidden; min-height: 100vh; }

    /* --- Fake desktop, blurred ------------------------------------------- */
    .rc-desk { position: fixed; inset: -40px; filter: blur(12px) saturate(1.15);
      background:
        radial-gradient(55% 60% at 22% 30%, color-mix(in srgb, var(--cat-research) 24%, transparent), transparent 70%),
        radial-gradient(45% 55% at 82% 75%, color-mix(in srgb, var(--cat-meetings) 16%, transparent), transparent 70%),
        radial-gradient(60% 50% at 65% 15%, color-mix(in srgb, var(--cat-learning) 14%, transparent), transparent 70%),
        var(--app-bg); }
    .rc-desk__menu { position: absolute; left: 40px; right: 40px; top: 40px; height: 26px; display: flex; align-items: center; gap: 22px; padding: 0 18px;
      background: color-mix(in srgb, var(--app-surface) 55%, transparent); font: 600 13px/1 var(--font-sans); color: var(--app-text-strong); }
    .rc-desk__menu span + span { font-weight: 400; }
    .rc-desk__win { position: absolute; border-radius: 12px; overflow: hidden; border: 1px solid var(--app-border-strong); background: var(--app-surface);
      display: grid; grid-template-rows: 30px 1fr; }
    .rc-desk__win > i { background: var(--app-surface-subtle); border-bottom: 1px solid var(--app-border); }
    .rc-desk__win > b { display: grid; align-content: start; gap: 14px; padding: 36px 40px; }
    .rc-desk__win > b span { display: block; height: 11px; border-radius: 6px; width: var(--w); background: color-mix(in srgb, var(--c, var(--app-fg)) 20%, transparent); }
    .rc-desk__dock { position: absolute; left: 50%; bottom: 52px; translate: -50% 0; display: flex; gap: 10px; padding: 8px 10px; border-radius: 18px;
      background: color-mix(in srgb, var(--app-surface) 55%, transparent); border: 1px solid var(--app-overlay-border); }
    .rc-desk__dock i { width: 44px; height: 44px; border-radius: 11px; background: color-mix(in srgb, var(--c) 40%, var(--app-surface)); }
    .rc-scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--app-bg) 22%, transparent); }

    /* --- The floating bar ---------------------------------------------------
       .rc-float holds --h (measured visible height) and --max (tallest it may grow). */
    .rc-float { --top: clamp(40px, 15vh, 140px); --max: min(640px, calc(100vh - var(--top) - 40px)); --cap: 420px; --h: 60px;
      position: fixed; z-index: 10; left: 50%; top: var(--top); width: min(800px, calc(100vw - 40px)); translate: -50% 0;
      transition: opacity var(--t-med) var(--ease-quart), transform var(--t-slow) var(--ease-expo); }
    .rc-float[data-closed] { opacity: 0; transform: translateY(-8px) scale(0.98); pointer-events: none; }
    /* Shadow source: a 100px block riding the bottom edge (translateY(--h)); the wrapper clips at the panel top. */
    .rc-shadewrap { position: absolute; left: -160px; right: -160px; top: 0; height: calc(var(--max) + 200px); overflow: hidden; pointer-events: none; }
    .rc-shade { position: absolute; left: 160px; right: 160px; top: 0; height: 100px; border-radius: var(--r-xl);
      box-shadow: 0 34px 80px -26px color-mix(in srgb, var(--app-bg) 60%, black), 0 12px 28px -14px color-mix(in srgb, var(--app-bg) 50%, black);
      transform: translateY(calc(var(--h) - 100px)); }
    .rc { position: relative; height: var(--max); border-radius: var(--r-xl); border: 1px solid var(--app-border-strong);
      background: color-mix(in srgb, var(--app-bg) 90%, transparent);
      -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4);
      clip-path: inset(0 0 calc(var(--max) - var(--h)) 0 round var(--r-xl)); }
    /* bottom edge + corners of the border, riding the clip */
    .rc-cap { position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: 24px; pointer-events: none;
      border: 1px solid var(--app-border-strong); border-top: 0; border-radius: 0 0 var(--r-xl) var(--r-xl);
      transform: translateY(calc(var(--h) - 24px)); }
    .rc-float[data-ready] .rc { transition: clip-path var(--t-slow) var(--ease-expo); }
    .rc-float[data-ready] :is(.rc-cap, .rc-shade) { transition: transform var(--t-slow) var(--ease-expo); }

    .rc-float[data-look] { --cap: 640px; }
    .rc-inner { display: flex; flex-direction: column; max-height: calc(min(var(--cap), var(--max)) - 2px); transition-property: none; } /* measured synchronously: keep kit's reduced-motion `all` transition off it */
    /* the Quick Look key shows only once you've arrowed into the list (Space types a space in the field) */
    .rc:not([data-nav]) .rc-k-nav, .rc-hero[aria-selected="false"] .rc-k-nav { display: none; }
    .rc-ghost { color: var(--app-text-subtle); opacity: 0.7; } /* inline completion; → accepts */

    /* --- Bar ------------------------------------------------------------- */
    .rc-bar { flex: none; height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 13px; }
    .rc-mode { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; min-width: 30px; padding: 0 7px; border: 0; border-radius: var(--r-md);
      background: none; color: var(--app-text-subtle); cursor: pointer; font: 600 var(--text-md)/1 var(--font-sans);
      transition: background-color var(--t-med) var(--ease-quart), color var(--t-med) var(--ease-quart), box-shadow var(--t-med) var(--ease-quart); }
    .rc-mode:hover { background: var(--mx-wash-strong); color: var(--app-text); }
    .rc-mode__g { display: grid; width: 17px; height: 17px; }
    .rc-mode__g svg { grid-area: 1 / 1; transition: transform var(--t-slow) var(--ease-expo), opacity var(--t-med) var(--ease-quart); }
    .rc-mode__g svg + svg { opacity: 0; transform: rotate(-90deg) scale(0.5); }
    .rc-mode b { display: none; font-weight: 600; }
    .rc-mode small { display: none; font: 500 var(--text-xs)/1 var(--font-mono); color: color-mix(in srgb, var(--app-accent) 70%, var(--app-text-subtle)); }
    .rc[data-ask] .rc-mode { background: var(--app-accent-bg); color: var(--app-accent); box-shadow: inset 0 0 0 1px var(--app-accent-border); }
    .rc[data-ask] .rc-mode b, .rc[data-ask][data-auto] .rc-mode small { display: inline; }
    .rc[data-ask] .rc-mode__g svg:first-child { opacity: 0; transform: rotate(90deg) scale(0.5); }
    .rc[data-ask] .rc-mode__g svg + svg { opacity: 1; transform: none; }

    .rc-field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .rc-tok { flex: none; max-width: 220px; }
    .rc-tok > span { overflow: hidden; text-overflow: ellipsis; }
    .rc-tok svg { color: var(--app-text-subtle); }
    .rc-tok .rc-dot { width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
    .rc-tok[aria-pressed="true"] { --_bd: var(--app-border-hover); }
    .rc-inwrap { position: relative; flex: 1; min-width: 120px; height: 34px; display: flex; overflow: hidden; }
    .rc-inwrap input { flex: 1; min-width: 0; padding: 0; border: 0; outline: 0; background: none;
      font: 400 19px/34px var(--font-sans); letter-spacing: -0.012em; color: transparent; caret-color: var(--app-text-strong); }
    .rc-inwrap input::placeholder { color: var(--app-text-subtle); }
    .rc-inwrap input::selection { color: transparent; }
    .rc-inwrap input:focus-visible { box-shadow: none; }
    .rc-mirror { position: absolute; inset: 0; pointer-events: none; white-space: pre; overflow: hidden;
      font: 400 19px/34px var(--font-sans); letter-spacing: -0.012em; color: var(--app-text-strong); }
    /* recognized phrase, still text: a pill drawn with shadow so glyph positions never move */
    .rc-live { border-radius: 4px; background: var(--mx-selected); box-shadow: 0 0 0 3px var(--mx-selected);
      animation: rc-tint var(--t-med) var(--ease-quart) both; }
    @keyframes rc-tint { from { background: transparent; box-shadow: 0 0 0 3px transparent; } }
    .rc-right { flex: none; display: inline-flex; align-items: center; gap: 12px; font: 450 var(--text-sm)/1 var(--font-mono); color: var(--app-text-subtle);
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rc-right span { display: inline-flex; align-items: center; gap: 5px; }
    .rc-right kbd { height: 18px; }
    .rc-right b { font-weight: 500; color: var(--app-text); }

    /* --- Body ------------------------------------------------------------ */
    .rc-body { flex: 0 1 auto; min-height: 0; overflow: auto; padding: 8px 8px 10px; border-top: 1px solid var(--mx-hairline); scroll-padding: 8px; }
    .rc-body:empty, .rc-foot:empty { display: none; }

    /* Hero: one confident moment, rendered richly */
    .rc-hero { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 18px; padding: 10px; border-radius: var(--r-lg); cursor: default;
      transition: background-color var(--t-fast) var(--ease-quart); }
    .rc-hero[aria-selected="true"] { background: var(--mx-selected); }
    .rc-crop { position: relative; height: 168px; overflow: hidden; border-radius: var(--r-md); background: var(--app-surface-subtle);
      box-shadow: inset 0 0 0 1px var(--app-border); }
    .rc-crop .rc-shot { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition-property: none; } /* JS-driven zoom; keep kit's reduced-motion `all` transition off it */
    .rc-crop::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--app-border); pointer-events: none; }
    .rc-crop time { position: absolute; z-index: 1; left: 8px; bottom: 8px; padding: 3px 6px; border-radius: var(--r-xs);
      background: var(--app-overlay-bg-strong); border: 1px solid var(--app-overlay-border); font: 500 var(--text-xs)/1 var(--font-mono); color: var(--app-text-strong); }
    .rc-hero__info { min-width: 0; display: grid; align-content: start; gap: 6px; padding-top: 2px; }
    .rc-hero__k { display: flex; align-items: center; gap: 10px; }
    .rc-hero__k .mono { margin-left: auto; font-size: var(--text-xs); color: var(--app-text-subtle); font-variant-numeric: tabular-nums; }
    .rc-hero__t { display: flex; align-items: center; gap: 8px; min-width: 0; margin: 2px 0 0; font: 600 var(--text-lg)/1.3 var(--font-sans); letter-spacing: -0.012em; color: var(--app-text-strong); }
    .rc-hero__t span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rc-meta { display: flex; flex-wrap: wrap; gap: 2px 10px; font: 400 var(--text-sm)/1.4 var(--font-mono); color: var(--app-text-subtle); font-variant-numeric: tabular-nums; }
    .rc-meta b { font-weight: 500; color: var(--app-text); }
    .rc-snip { margin: 2px 0 0; font: 400 var(--text-md)/1.55 var(--font-sans); color: var(--app-text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rc-snip q { quotes: "“" "”"; color: var(--app-text); }
    .rc-why { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 400 var(--text-sm)/1.3 var(--font-sans); color: var(--app-text-subtle); }
    .rc-why .mx-chip { height: 18px; padding: 0 6px; }
    .rc-acts[hidden] { display: none; }
    .rc-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }

    /* Audio crop: the matched stretch of the waveform */
    .rc-acrop { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; height: 100%; padding: 12px 12px 10px;
      background: color-mix(in srgb, var(--s) 7%, var(--app-surface-subtle)); }
    .rc-acrop header { display: flex; align-items: center; gap: 6px; font: 500 var(--text-xs)/1 var(--font-mono); color: var(--s); letter-spacing: 0.02em; }
    .rc-wave { position: relative; display: flex; align-items: center; gap: 2px; min-height: 0; }
    .rc-wave i { flex: 1; height: calc(var(--v) * 1%); min-height: 2px; border-radius: 1px; background: color-mix(in srgb, var(--app-fg) 18%, transparent); }
    .rc-wave i.on { background: var(--app-accent); }
    .rc-acrop footer { display: flex; justify-content: space-between; font: 400 var(--text-xs)/1 var(--font-mono); color: var(--app-text-subtle); font-variant-numeric: tabular-nums; }
    .rc-acrop footer b { font-weight: 500; color: var(--app-accent); }

    /* Ranked list: one line per moment */
    .rc-sec { display: flex; align-items: baseline; gap: 8px; margin: 10px 10px 4px; font: 500 var(--text-base)/1 var(--font-sans); color: var(--app-text-subtle); }
    .rc-sec .mono { font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
    .rc-sec .mono:last-child { margin-left: auto; }
    .rc-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto 26px; gap: 10px; align-items: center; height: 34px; padding: 0 10px;
      border-radius: var(--r-md); cursor: default; color: var(--app-text); transition: background-color var(--t-fast) var(--ease-quart); }
    .rc-row:hover, .rc-row[data-hot] { background: var(--mx-wash); }
    .rc-row[aria-selected="true"] { background: var(--mx-selected); }
    .rc-row--cited { grid-template-columns: 18px 18px minmax(0, 1fr) auto auto 26px; }
    /* the row's Quick Look affordance: appears on hover / selection */
    .rc-peek { opacity: 0; transition: opacity var(--t-fast) var(--ease-quart); }
    .rc-row:hover .rc-peek, .rc-row[aria-selected="true"] .rc-peek, .rc-peek:focus-visible { opacity: 1; }
    .rc-row--hit { padding-right: 4px; }
    .rc-row__t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 var(--text-md)/1 var(--font-sans); color: var(--app-text-strong); }
    .rc-row__t span { margin-left: 8px; font-weight: 400; color: var(--app-text-muted); }
    .rc-row__k { font: 400 var(--text-xs)/1 var(--font-mono); color: var(--app-text-subtle); }
    .rc-row time { min-width: 64px; text-align: right; font: 450 var(--text-sm)/1 var(--font-mono); color: var(--app-text-subtle); font-variant-numeric: tabular-nums; }
    .rc-row[aria-selected="true"] time { color: var(--app-text); }
    .rc-app { flex: none; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; font: 700 10px/1 var(--font-sans); font-style: normal;
      color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--app-surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
    .rc-app--sm { width: 15px; height: 15px; border-radius: 4px; font-size: 8.5px; }
    .rc-num { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: var(--r-xs); font: 500 var(--text-xs)/1 var(--font-mono);
      color: var(--app-text-muted); box-shadow: inset 0 0 0 1px var(--app-border-strong); }

    /* Answer hero */
    .rc-ans { display: block; padding: 14px 16px 12px; }
    .rc-ans__h { display: flex; align-items: center; gap: 8px; font: 600 var(--text-md)/1 var(--font-sans); color: var(--app-text-strong); }
    .rc-ans__h > svg { color: var(--app-accent); }
    .rc-ans__h .mono { font: 400 var(--text-sm)/1 var(--font-mono); color: var(--app-text-subtle); }
    .rc-ans__h .mx-btn { margin-left: auto; }
    .rc-livetag { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; font: 500 var(--text-base)/1 var(--font-sans); color: var(--app-text-muted); }
    .rc-livetag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--app-accent); box-shadow: 0 0 0 3px var(--app-accent-glow); }
    .rc-livetag--idle::before { background: var(--chart-grey-4); box-shadow: none; }
    .rc-ans__body { margin-top: 10px; }
    .rc-ans__body--split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; } /* block beside the prose keeps the answer ≤420 */
    .rc-ans__body p { margin: 0; max-width: 74ch; font: 400 14px/1.65 var(--font-sans); color: var(--app-text); text-wrap: pretty; }
    .rc-ans__body p strong { font-weight: 600; color: var(--app-text-strong); }
    .rc-ans__wait { display: grid; gap: 8px; padding: 4px 0 2px; }
    .rc-ans__wait .mx-skel { height: 11px; }
    .rc-ans__wait span { font: 400 var(--text-base)/1.4 var(--font-sans); color: var(--app-text-subtle); }
    .rc-cite { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 4px; margin: 0 1px; vertical-align: 1px; cursor: pointer;
      border-radius: var(--r-xs); background: var(--app-surface-hover); border: 1px solid var(--app-border-strong);
      font: 500 9.5px/1 var(--font-mono); color: var(--app-text-muted); transition: color var(--t-fast), border-color var(--t-fast); }
    .rc-cite:hover { color: var(--app-text-strong); border-color: var(--app-border-hover); }
    .rc-caret { display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; border-radius: 1px; background: var(--app-accent); }
    .rc-tl { margin: 2px 0 0; padding: 10px 12px 6px; border-radius: var(--r-md); background: var(--app-surface); border: 1px solid var(--app-border);
      animation: mx-rise var(--t-slow) var(--ease-expo) both; }
    .rc-tl[data-seen], .rc-tl[data-seen] li { animation: none; }
    .rc-tl h5 { margin: 0 0 6px; font: 500 var(--text-base)/1 var(--font-sans); color: var(--app-text-subtle); }
    .rc-tl ol { list-style: none; margin: 0; padding: 0; position: relative; }
    .rc-tl ol::before { content: ""; position: absolute; left: 68px; top: 12px; bottom: 12px; width: 1px; background: var(--app-border-strong); }
    .rc-tl li { display: grid; grid-template-columns: 54px 9px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 4px 0;
      animation: mx-rise var(--t-slow) var(--ease-expo) both; animation-delay: calc(var(--i) * 70ms); }
    .rc-tl time { font: 400 var(--text-xs)/1 var(--font-mono); color: var(--app-text-subtle); text-align: right; font-variant-numeric: tabular-nums; }
    .rc-tl li > i { width: 9px; height: 9px; border-radius: 50%; background: var(--app-bg); border: 1.5px solid var(--chart-grey-4); }
    .rc-tl li.key > i { border-color: var(--app-accent); background: var(--app-accent); }
    .rc-tl li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 var(--text-base)/1.45 var(--font-sans); color: var(--app-text); }

    /* Auto-answer off for this model: a quiet prompt in the hero slot, moments below */
    .rc-gate { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; cursor: pointer; }
    .rc-gate > svg { flex: none; color: var(--app-text-subtle); }
    .rc-gate__t { font: 500 var(--text-md)/1.3 var(--font-sans); color: var(--app-text); }
    .rc-gate__t b { font-weight: 600; color: var(--app-text-strong); }
    .rc-gate__t kbd { height: 18px; margin: 0 2px; }
    .rc-gate__why { margin-left: auto; font: 400 var(--text-sm)/1.3 var(--font-sans); color: var(--app-text-subtle); white-space: nowrap; }

    /* No results: relaxations are rows you can pick */
    .rc-none { padding: 14px 12px 4px; }
    .rc-none p { margin: 0; font: 400 14px/1.5 var(--font-sans); color: var(--app-text-muted); }
    .rc-none p b { font-weight: 600; color: var(--app-text-strong); }
    .rc-row--relax { grid-template-columns: 18px minmax(0, 1fr) auto; }
    .rc-row--relax > svg { color: var(--app-text-subtle); }

    /* Recents / suggestions */
    .rc-row--rec { grid-template-columns: 18px minmax(0, 1fr) auto; }
    .rc-row--rec > svg { color: var(--app-text-subtle); }
    .rc-row--rec .rc-row__t { font-weight: 400; color: var(--app-text); }
    .rc-row--rec[aria-selected="true"] .rc-row__t { color: var(--app-text-strong); }
    .rc-row--rec .rc-row__t em { font-style: normal; border-radius: 3px; background: var(--mx-wash-strong); box-shadow: 0 0 0 2px var(--mx-wash-strong); color: var(--app-text-strong); }

    /* --- Footer: the real query under the hood + keys -------------------- */
    .rc-foot { flex: none; height: 32px; display: flex; align-items: center; gap: var(--s-4); padding: 0 14px; border-top: 1px solid var(--mx-hairline);
      background: color-mix(in srgb, var(--app-surface) 55%, transparent); font: 400 var(--text-sm)/1 var(--font-sans); color: var(--app-text-subtle); white-space: nowrap; }
    .rc-foot__q { min-width: 0; flex: 1; display: flex; align-items: center; gap: 8px; overflow: hidden; }

    /* audio stage: the line, large, over a zoomed waveform */
    .rc-qa { position: absolute; inset: 0; display: grid; align-content: center; gap: 18px; padding: 44px 36px 20px; }
    .rc-qa__who { display: flex; align-items: center; gap: 9px; font: 500 var(--text-md)/1 var(--font-sans); color: var(--app-text-muted); }
    .rc-qa__who b { font-weight: 600; color: var(--app-text-strong); }

      color: var(--app-text-strong); background: color-mix(in srgb, var(--s) 26%, var(--app-surface)); }

    if (view === "slim") { recents = true; sel = 0; run(); } else { nav = true; select(sel + 1); }
  } else if (e.key === "ArrowUp") { e.preventDefault(); nav = true; select(sel - 1); }
  else if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); if (view !== "slim" && view !== "recent") { commit(true); toggleMode(); } }
  else if (e.key === "Enter" && e.metaKey) { e.preventDefault(); act(view === "ask" && sel === 0 ? "chat" : "page"); }
  else if (e.key === "Enter") { e.preventDefault(); commit(false); activate(); }
  else if ((e.key === "c" || e.key === "C") && e.metaKey && input.selectionStart === input.selectionEnd) { e.preventDefault(); act("copy"); }
  else if (e.key === "Escape") {
    e.preventDefault();
    if (pop.hasAttribute("data-show")) hidePop();
    else if (ans.phase === "stream" || ans.phase === "think") act("stop");
    else if (citeSel) { citeSel = 0; paintCites(); renderChrome(); }
    else if (view === "recent") { recents = false; run(); }
    else if (input.value || Object.keys(toks).length) { input.value = ""; toks = {}; sel = 0; nav = false; renderPills(); renderMirror(); run(); }
    else close();
  }
});
field.addEventListener("click", (e) => {
  const tok = e.target.closest(".rc-tok");
  if (tok) { pillSel = tok.dataset.k; renderPills(); pop.hasAttribute("data-show") && pop.dataset.k === tok.dataset.k ? hidePop() : showPop(tok.dataset.k); }
  else input.focus();
});
$("#rc-mode").addEventListener("click", () => { if (view !== "slim" && view !== "recent") toggleMode(); input.focus(); });
body.addEventListener("click", (e) => {
  const film = e.target.closest(".rc-film");
  if (film && look) { look.k = +film.dataset.k; renderBody(); renderChrome(); input.focus(); return; }
  const cite = e.target.closest("[data-cite]");
  if (cite) { sel = 0; nav = true; openCite(+cite.dataset.cite, cite.getBoundingClientRect()); input.focus(); return; }
  const b = e.target.closest("[data-act]");
  if (b) { const row = !look && b.closest("[data-i]"); if (row) sel = +row.dataset.i; act(b.dataset.act); input.focus(); return; }
  const row = e.target.closest("[data-i]");
  if (row && !look) { const i = +row.dataset.i; nav = true; if (i === sel && items[i].type !== "ans") activate(); else select(i, false); }
  input.focus();
});
body.addEventListener("pointerover", (e) => {
  if (look) return;
  const c = e.target.closest("[data-cite]");
  $$(".rc-row[data-hot]", body).forEach((r) => r.removeAttribute("data-hot"));
  if (c) $(`.rc-row[data-n="${c.dataset.cite}"]`, body)?.setAttribute("data-hot", "");
  else paintCites();
});
$("#rc-scrim").addEventListener("click", () => !float.hasAttribute("data-closed") && close());
document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".rc-pop, .rc-tok")) hidePop(); });
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.altKey && e.metaKey) { e.preventDefault(); float.hasAttribute("data-closed") ? reopen() : close(); }
});
window.addEventListener("resize", () => look && fitLook());

/* ===== Boot + hooks ==================================================== */
const picker = $("#rc-state");
picker.innerHTML = Object.entries(RC_STATES).map(([k, [l]]) => `<option value="${k}"${k === STATE ? " selected" : ""}>${l}</option>`).join("");
picker.addEventListener("change", () => { const th = new URLSearchParams(location.search).get("theme"); location.search = new URLSearchParams({ ...(picker.value ? { state: picker.value } : {}), ...(th ? { theme: th } : {}) }); });
(async () => {
  renderMirror(); run();
  if (P.get("state") === "recent") { recents = true; run(); }
  if (P.has("q")) {
    input.value = P.get("q"); renderMirror(); run(); commit(false);
    if (P.has("tab")) toggleMode();
  }
  if (P.has("sel")) { nav = true; select(+P.get("sel")); }
  if (P.get("pill") && toks[P.get("pill")]) { await document.fonts.ready; pillSel = P.get("pill"); renderPills(); showPop(pillSel); }
  if (P.get("state") === "closed") close(`Opening <b>Timeline</b> at <span class="mono">Tue 14:12:15</span> <span class="mono">(+0:15 from the match)</span> — Pricing — Mnema`, 60000);
  await document.fonts.ready; renderMirror(); render();
  requestAnimationFrame(() => float.setAttribute("data-ready", ""));
  input.focus();
  const wantCite = +P.get("cite") || (P.has("look") && view === "ask" ? 1 : 0);
  if (view === "ask" && wantCite) onAnswerDone = () => { sel = 0; nav = true; citeSel = wantCite; paintCites(); renderChrome(); if (P.has("look")) openCite(wantCite); };
  else if (P.has("look")) openLook(sel);
  // ?keys=down,space — replays keys into the bar (render checks of the keymap)
  const KEY = { down: "ArrowDown", up: "ArrowUp", left: "ArrowLeft", right: "ArrowRight", space: " ", tab: "Tab", enter: "Enter", esc: "Escape" };
  for (const k of (P.get("keys") || "").split(",").filter(Boolean)) { await sleep(400); input.dispatchEvent(new KeyboardEvent("keydown", { key: KEY[k] || k, bubbles: true, cancelable: true })); }
})();
</script>
