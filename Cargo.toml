[workspace]
members = [
    "apps/desktop/src-tauri",
    "apps/desktop-gpui",
    "crates/ai-runtime",
    "crates/app-core",
    "crates/app-infra",
    "crates/cli",
    "crates/audio-transcription",
    "crates/speaker-analysis",
    "crates/ocr",
    "crates/semantic-search",
    "crates/capture-runtime",
    "crates/capture-microphone",
    "crates/capture-metadata",
    "crates/capture-screen",
    "crates/capture-system-audio",
    "crates/capture-types",
    "crates/capture-vad",
    "crates/capture-writers",
    "crates/secret-redaction",
]
# The vendored GPUI text crate is a dependency, not a workspace member.
exclude = ["vendor/gpui-pre-apple"]
resolver = "2"

# gpui-pre-apple 0.3.11 plus three Mnema changes (grep "Mnema change"): no stroke thickening
# (`no_font_smoothing`) and letter-spacing (`MNEMA_TRACKING_TAG`) in text_system.rs, and
# shadow corners that grow with the spread in shaders.metal.
[patch.crates-io]
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
