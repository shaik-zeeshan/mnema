[package]
name = "app-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# `fixtures` seeds a temp data dir (DB rows + generated JPEG frames) for tests,
# goldens and the parity dumper. Default-on so `cargo test -p app-core` covers
# it; the desktop binaries depend on app-core with `default-features = false`.
default = ["fixtures"]
fixtures = ["dep:image"]
# Trace OCR admission/pacing decisions to the app log (forwarded from the desktop crate).
ocr-budget-trace = []
# Compile the speakrs engine into the speaker-analysis helper subprocess
# (forwarded from the desktop crate's default-on feature of the same name).
speaker-analysis-speakrs = ["speaker-analysis/speakrs"]

[dependencies]
# The Reasoning Engine, aliased so it does not collide with `crate::ai_runtime`.
ai-engine = { package = "ai-runtime", path = "../ai-runtime" }
app-infra = { path = "../app-infra" }
async-trait = "0.1"
# parakeet-onnx: the Parakeet availability check the model status reads (the desktop crate enables it too).
audio-transcription = { path = "../audio-transcription", features = ["parakeet-onnx"] }
base64 = "0.22"
bzip2 = "0.6"
capture-metadata = { path = "../capture-metadata" }
capture-screen = { path = "../capture-screen" }
capture-types = { path = "../capture-types" }
capture-writers = { path = "../capture-writers" }
dirs = "6"
futures-util = "0.3"
# Same parser the desktop global-shortcut plugin registers with (its 0.7 pin).
global-hotkey = "0.7"
licensegate = "0.2"
fs2 = "0.4"
log = "0.4"
ocr = { path = "../ocr" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
schemars = "1"
semantic-search = { path = "../semantic-search" }
speaker-analysis = { path = "../speaker-analysis", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.15", default-features = false, features = ["av", "cf", "ns", "macos_15_0"] }
cocoa = "0.26"
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
objc = "0.2"
# The updater's install gate (Apple code-signature checks on a downloaded bundle).
security-framework = "3"
security-framework-sys = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }

[[example]]
name = "dump_fixture"
required-features = ["fixtures"]
