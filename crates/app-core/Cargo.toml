[package]
name = "app-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# `fixtures` seeds a temp data dir (DB rows + generated JPEG frames) for tests,
# goldens and the parity dumper. Default-on so `cargo test -p app-core` covers
# it; the desktop binaries depend on app-core with `default-features = false`.
default = ["fixtures"]
fixtures = []
# Trace OCR admission/pacing decisions to the app log (forwarded from the desktop crate).
ocr-budget-trace = []
# Compile the speakrs engine into the speaker-analysis helper subprocess
# (forwarded from the desktop crate's default-on feature of the same name).
speaker-analysis-speakrs = ["speaker-analysis/speakrs"]
# Trace privacy-filter refresh requests and applies (forwarded from the desktop crate).
privacy-refresh-trace = []

[dependencies]
# The Reasoning Engine, aliased so it does not collide with `crate::ai_runtime`.
ai-engine = { package = "ai-runtime", path = "../ai-runtime" }
app-infra = { path = "../app-infra" }
async-trait = "0.1"
# parakeet-onnx: the Parakeet availability check the model status reads (the desktop crate enables it too).
audio-transcription = { path = "../audio-transcription", features = ["parakeet-onnx"] }
base64 = "0.22"
bzip2 = "0.6"
capture-metadata = { path = "../capture-metadata" }
capture-microphone = { path = "../capture-microphone" }
capture-runtime = { path = "../capture-runtime" }
capture-screen = { path = "../capture-screen" }
capture-system-audio = { path = "../capture-system-audio" }
capture-types = { path = "../capture-types" }
capture-vad = { path = "../capture-vad" }
capture-writers = { path = "../capture-writers" }
dirs = "6"
futures-util = "0.3"
# Same parser the desktop global-shortcut plugin registers with (its 0.7 pin).
global-hotkey = "0.7"
licensegate = "0.2"
fs2 = "0.4"
# The GPUI updater: unpack the .app.tar.gz, verify its minisign signature (the
# same verifier tauri-plugin-updater uses), compare feed versions.
flate2 = "1"
minisign-verify = "0.2"
semver = "1"
log = "0.4"
ocr = { path = "../ocr" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
schemars = "1"
semantic-search = { path = "../semantic-search" }
speaker-analysis = { path = "../speaker-analysis", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
# Ask AI's `fetch_url`: HTML to Markdown, and the body's declared charset.
htmd = "0.5.4"
# Charset-aware decode of the fetched body (already in the tree via reqwest's
# `charset` feature). `bytes_stream()` yields raw bytes, so we decode by the
# declared Content-Type charset rather than assuming UTF-8.
encoding_rs = "0.8"
# MCP tool connectors (Ask AI).
rmcp = { version = "2.1.0", default-features = false, features = ["client", "macros", "auth", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-io", "transport-async-rw"] }
# rmcp 2.1.0's OAuth `AuthClient<C>` is only a `StreamableHttpClient` when `C` is
# rmcp's OWN reqwest — which is 0.13, a semver bump from the workspace's 0.12 (a
# different, incompatible `reqwest::Client` type). rmcp neither re-exports reqwest
# nor exposes its default client builder, so the OAuth transport must name the
# 0.13 client itself. Aliased to `reqwest13` so it coexists with the 0.12 dep
# above; 0.13 defaults to rustls (`default-tls = ["rustls"]`), so `rustls` keeps
# us native-tls-free (ADR 0037), matching the workspace's rustls alignment.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
# Same semver line as rmcp's internal process-wrap dep (versions unify in Cargo.lock);
# used to spawn stdio MCP servers as a process-group leader so drop-kill takes the
# whole group (launcher + grandchildren), not just the launcher.
process-wrap = { version = "9.0", features = ["tokio1", "process-group"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.15", default-features = false, features = ["av", "blocks", "cf", "cg", "cm", "iio", "ns", "ut", "macos_15_0"] }
cocoa = "0.26"
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
objc = "0.2"
# The updater's install gate (Apple code-signature checks on a downloaded bundle).
security-framework = "3"
security-framework-sys = "2"

[dev-dependencies]
# Signs throwaway update archives in the updater flow tests.
ed25519-dalek = "2"
tokio = { version = "1", features = ["macros"] }

[[example]]
name = "dump_fixture"
required-features = ["fixtures"]
